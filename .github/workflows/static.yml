name: Build and Publish KiCad PCM

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "footprints/**"
      - "symbols/**"
      - "3dmodels/**"
      - "resources/**"
      - "metadata.json"
      - "generateLib.py"
      - ".github/workflows/pcm.yml"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build KiCad PCM
        run: python generateLib.py

      - name: Show generated files
        run: |
          echo "Generated ZIP:"
          ls -lh dist/

          echo "PCM metadata:"
          ls -lh pcm/

          echo "ZIP SHA256:"
          sha256sum dist/*.zip

      # This makes the ZIP visible/downloadable from the Actions run
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mecatron-kicad-pcm
          path: |
            dist/*.zip
            pcm/packages.json
            pcm/repository.json

      # Only make a GitHub Release when using a v* tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.zip \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

      # Only publish the official PCM repository for tagged versions
      - name: Prepare GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p _site/pcm
          mkdir -p _site/dist

          cp pcm/repository.json _site/pcm/
          cp pcm/packages.json _site/pcm/
          cp dist/*.zip _site/dist/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Mecatron KiCad Library</title>
          </head>
          <body>
            <h1>Mecatron KiCad Library</h1>
            <p>Mecatron KiCad Plugin and Content Manager repository.</p>
            <p><a href="pcm/repository.json">repository.json</a></p>
          </body>
          </html>
          EOF

      - name: Configure Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
