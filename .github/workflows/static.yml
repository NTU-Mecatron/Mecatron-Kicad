name: Build and Deploy KiCad PCM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build KiCad PCM package
        run: python generateLib.py

      - name: Show generated files
        run: |
          echo "PCM files:"
          ls -lh pcm/

          echo "ZIP files:"
          ls -lh dist/

          echo "packages.json SHA256:"
          sha256sum pcm/packages.json

          echo "ZIP SHA256:"
          sha256sum dist/*.zip

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p _site/pcm
          mkdir -p _site/dist

          cp pcm/repository.json _site/pcm/
          cp pcm/packages.json _site/pcm/
          cp dist/*.zip _site/dist/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Mecatron KiCad Library</title>
          </head>
          <body>
            <h1>Mecatron KiCad Library</h1>
            <p>KiCad Plugin and Content Manager repository.</p>
            <p>
              Repository URL:
              <a href="pcm/repository.json">pcm/repository.json</a>
            </p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
