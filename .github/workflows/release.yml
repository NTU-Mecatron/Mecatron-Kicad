name: Release KiCad PCM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, X.Y.Z, no leading v (e.g. 1.1.0)"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be X.Y.Z with no leading v. Got: $VERSION"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Bump version in metadata.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json, os
          v = os.environ["VERSION"]
          with open("metadata.json") as f:
              m = json.load(f)
          m["versions"][0]["version"] = v
          with open("metadata.json", "w") as f:
              json.dump(m, f, indent=4)
              f.write("\n")
          PY

      - name: Build
        run: python generateLib.py

      - name: Commit, tag, push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata.json
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.zip \
            --generate-notes --title "v$VERSION"

      - name: Prepare Pages
        run: |
          mkdir -p _site/pcm _site/dist
          cp pcm/repository.json pcm/packages.json _site/pcm/
          cp dist/*.zip _site/dist/
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>Mecatron KiCad Library</title></head>
          <body>
            <h1>Mecatron KiCad Library</h1>
            <p>Mecatron KiCad Plugin and Content Manager repository.</p>
            <p><a href="pcm/repository.json">repository.json</a></p>
          </body></html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
